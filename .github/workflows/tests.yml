name: Tests

on:
  pull_request:
  push:
    branches: [main] # the outage bot pushes with GITHUB_TOKEN, which doesn't trigger workflows
  schedule:
    - cron: "0 11 * * *" # daily, to catch upstream NWS/NOAA/CMP format changes
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
