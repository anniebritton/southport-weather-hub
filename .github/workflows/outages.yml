name: Refresh outage data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time; a late run waits instead of racing the previous one's push.
concurrency:
  group: refresh-outages
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Fetch CMP outage data
        env:
          # Optional repository secret; falls back to CMP's public frontend key if unset.
          OUTAGE_API_KEY: ${{ secrets.OUTAGE_API_KEY }}
        run: python3 scripts/fetch_outages.py

      - name: Commit if changed
        run: |
          git config user.name "outage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/outages.json
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Update outage data"
          # Pick up any commit that landed while this job ran, then push (retry once on a race)
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push; }
